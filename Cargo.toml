[package]
name = "mid"
version = "5.1.0"
edition = "2024"
description = "Creating a Machine ID hash for MacOS/Windows/Linux/iOS"
readme = "README.md"
repository = "https://github.com/doroved/mid"
license = "MIT OR Apache-2.0"
keywords = ["hardware-id", "hwid", "machineid", "machineuid", "uuid"]
categories = ["accessibility", "authentication", "config"]
include = [
  "Cargo.toml",
  "README.md",
  "src/**/*",
]

[lib]
crate-type = ["lib", "staticlib"]
doctest = false

[[example]]
name = "example"
path = "example/main.rs"
required-features = ["serde", "serde_json"]

[dependencies]
hex = "0.4.3"
hmac-sha256 = "1.1.14"
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.150", optional = true }

[target.'cfg(target_os = "ios")'.dependencies]
core-foundation = "0.10.1"
nanoid = "0.5.0"
security-framework = "3.7.0"
sha2 = "0.11.0"

[target.'cfg(target_os = "windows")'.dependencies]
smbios-lib = "0.9.2"

[features]
serde = ["dep:serde"]
serde_json = ["dep:serde_json"]
