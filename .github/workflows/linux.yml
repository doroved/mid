name: MID linux

on:
  # push:
  #   branches: [ "main" ]
  # pull_request:
  #   branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test -- --nocapture
      - name: Read machine-id files directly
        run: |
          echo "=== /etc/machine-id ==="
          cat /etc/machine-id || echo "not available"
          echo "=== /var/lib/dbus/machine-id ==="
          cat /var/lib/dbus/machine-id || echo "not available"
          echo "=== /sys/class/dmi/id/product_uuid ==="
          cat /sys/class/dmi/id/product_uuid || echo "not available (requires root)"
